<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:,">
<title>NIGHT SHIFT — The Archive</title>
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    background: #0b0d12;
    color: #e8e6df;
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  #game-root {
    position: relative;
    width: 960px;
    margin: 18px auto 0;
  }
  #game-canvas {
    display: block;
    width: 960px;
    height: 640px;
    background: #1b1e28;
    border: 1px solid #333948;
    border-radius: 6px;
    cursor: crosshair;
  }
  .hud-bar {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 8px 4px;
    font-size: 14px;
  }
  .hud-objective { flex: 1; color: #ffd75e; }
  .hud-objective.done { color: #39d97a; }
  .hud-timer, .hud-score, .hud-intel { color: #c9cede; white-space: nowrap; }
  .hud-suspicion {
    display: flex;
    align-items: center;
    gap: 6px;
    white-space: nowrap;
  }
  .hud-suspicion-label { font-size: 11px; letter-spacing: 1px; color: #9aa1b5; }
  .hud-suspicion-bar {
    width: 110px;
    height: 10px;
    background: #262b38;
    border: 1px solid #3a4152;
    border-radius: 5px;
    overflow: hidden;
  }
  .hud-suspicion-fill {
    height: 100%;
    width: 0%;
    background: #ffd65a;
    transition: width 0.12s linear;
  }
  .hud-suspicion-fill.warn { background: #ff9a2e; }
  .hud-suspicion-fill.danger { background: #ff4a30; }
  .hud-banner {
    position: absolute;
    top: 74px;
    left: 50%;
    transform: translateX(-50%);
    padding: 8px 16px;
    border-radius: 4px;
    font-weight: 600;
    font-size: 15px;
    background: rgba(20, 24, 34, 0.92);
    border: 1px solid #565d70;
    z-index: 5;
    white-space: nowrap;
  }
  .hud-banner.warn { border-color: #ff9a2e; color: #ffcf8a; }
  .hud-banner.danger { border-color: #ff4a30; color: #ff8a7a; }
  .hud-banner.good { border-color: #39d97a; color: #8fe9b4; }
  .hud-banner.hidden { display: none; }
  .screen-overlay {
    position: absolute;
    inset: 52px 0 0 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    background: rgba(8, 10, 15, 0.86);
    border-radius: 6px;
    z-index: 10;
    padding: 24px;
  }
  .screen-overlay.hidden { display: none; }
  .screen-overlay.caught { background: rgba(40, 8, 6, 0.88); }
  .screen-overlay.win { background: rgba(6, 32, 18, 0.88); }
  .screen-title {
    margin: 0 0 8px;
    font-size: 52px;
    letter-spacing: 6px;
    color: #ffd75e;
  }
  .screen-overlay.caught .screen-title { color: #ff5a3c; }
  .screen-overlay.win .screen-title { color: #39d97a; }
  .screen-body { max-width: 560px; font-size: 16px; line-height: 1.5; color: #d5d9e4; }
  .screen-body p { margin: 8px 0; }
  .screen-tag { color: #9aa1b5; font-style: italic; }
  .screen-controls { font-size: 14px; color: #9aa1b5; }
  .screen-stats { font-size: 17px; color: #e8e6df; }
  .screen-hint {
    margin-top: 18px;
    font-size: 15px;
    font-weight: 600;
    color: #ffffff;
    animation: pulse 1.6s ease-in-out infinite;
  }
  @keyframes pulse { 0%, 100% { opacity: 0.55; } 50% { opacity: 1; } }
  .foot {
    width: 960px;
    margin: 10px auto 24px;
    font-size: 13px;
    color: #7c8296;
    text-align: center;
  }
</style>
</head>
<body>
<div id="game-root">
  <canvas id="game-canvas"></canvas>
</div>
<p class="foot">NIGHT SHIFT — The Archive &nbsp;·&nbsp; an original stealth game &nbsp;·&nbsp; WASD / arrows to move, Shift to sneak, click to walk there, M to mute</p>
<script type="module" src="./src/main.js"></script>
</body>
</html>
